<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>節奏白板</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef3f8;--ink:#1f2937;--muted:#6b7280;--accent:#2563eb;--card:#fff;--line:#cbd5e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--ink:#e5e7eb;--muted:#9ca3af;--accent:#60a5fa}}
:root[data-theme="dark"]{--bg:#111827;--ink:#e5e7eb;--muted:#9ca3af;--accent:#60a5fa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:16px}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 4px}
p.hint{margin:0 0 12px;color:var(--muted);font-size:.95rem}
.palette{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
.pcard{background:#fff;color:#111;border:2px solid var(--line);border-radius:12px;padding:6px 8px 6px;text-align:center;cursor:grab;touch-action:none;user-select:none}
.pcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.3)}
.pcard span{display:block;font-size:.8rem;margin-top:2px;white-space:nowrap}
.pcard svg{display:block;margin:0 auto}
.ctrl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
button{font:inherit;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:#111;cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bpm{display:flex;align-items:center;gap:6px}
.dots{display:flex;gap:5px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:#f59e0b}
.msg{min-height:1.4em;color:#dc2626;font-size:.95rem;margin-bottom:6px}
.board{background:#fff;color:#111;border-radius:14px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.15);overflow-x:auto}
.row{display:flex;align-items:stretch;margin:12px 0;min-width:720px}
.ts{width:44px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:700;font-size:1.5rem;line-height:1.1;flex:none}
.ts.empty{visibility:hidden}
.m{flex:1;min-width:0;border-left:3px solid #111}
.m:last-child{border-right:3px double #111}
.m.bad{background:#fee2e2}
.ms{display:block;width:100%;height:auto;touch-action:none}
.cnt{font-size:.8rem;text-align:center;color:#94a3b8;height:1.3em}
.cnt.full{color:#16a34a;font-weight:700}
.blk{cursor:grab}
.blk.playing rect{stroke:#f59e0b;stroke-width:2.5}
.ghost{position:fixed;pointer-events:none;z-index:99;opacity:.85;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<div class="wrap">
<h1>🥁 節奏白板</h1>
<p class="hint">把圖卡拖進小節裡，圖卡會自動接在一起，長度就是它的拍數；每小節剛好 4 拍。也可以先點圖卡再點小節。點一下已放的圖卡可以拿掉。</p>
<div class="palette" id="palette"></div>
<div class="ctrl">
  <button id="play">▶ 播放節奏</button>
  <button id="met">⏱ 節拍器</button>
  <div class="bpm"><label for="bpm">速度</label><input type="range" id="bpm" min="40" max="160" step="5" value="80"><b id="bpmv">80</b></div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <label><input type="checkbox" id="countin" checked> 播放前先數一小節</label>
</div>
<div class="msg" id="msg" role="status"></div>
<div class="board" id="board"></div>
<div class="ctrl" style="margin-top:14px"><button id="clear">全部清除</button></div>
</div>
<script>
const DUR={e:1,q:2,d:3,h:4,r:2}, CAP=8, U=25; // 單位：半拍；1 半拍 = 25 個座標單位
const NAME={e:["八分音符","半拍"],q:["四分音符","1 拍"],d:["附點四分音符","1.5 拍"],h:["二分音符","2 拍"],r:["四分休止符","1 拍"]};
const COL={e:"#fde2e4",q:"#dbeafe",d:"#e0e7ff",h:"#dcfce7",r:"#f1f5f9"};
const $=s=>document.querySelector(s);
const M=Array.from({length:8},()=>[]);

function head(cx,open){return `<ellipse cx="${cx}" cy="56" rx="6.5" ry="4.8" transform="rotate(-20 ${cx} 56)" fill="${open?"#fff":"#111"}" stroke="#111" stroke-width="${open?1.8:0}"/>`}
function stem(x){return `<line x1="${x}" y1="54" x2="${x}" y2="18" stroke="#111" stroke-width="1.8"/>`}
function glyph(t,x,pair){
  const w=DUR[t]*U;
  let g=`<rect x="${x+1}" y="6" width="${w-2}" height="62" rx="4" fill="${COL[t]}" stroke="transparent"/>`;
  if(t==="q"){const c=x+21;g+=head(c)+stem(c+6)}
  else if(t==="h"){const c=x+44;g+=head(c,true)+stem(c+6)}
  else if(t==="d"){const c=x+28;g+=head(c)+stem(c+6)+`<circle cx="${c+14}" cy="52" r="2.5" fill="#111"/>`}
  else if(t==="e"){
    const c=x+8;g+=head(c)+stem(c+6);
    if(pair==="L")g+=`<rect x="${c+5.1}" y="17" width="${U+1.8}" height="4.5" fill="#111"/>`;
    else if(!pair)g+=`<path d="M${c+6} 18 C${c+6} 26 ${c+14} 28 ${c+13} 38" fill="none" stroke="#111" stroke-width="2.2"/>`;
  }
  else g+=`<path d="M28 12 L44 30 L30 42 L44 58 C34 54 28 62 34 70 C38 74 42 72 44 70" fill="none" stroke="#111" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" transform="translate(${x-1} 8) scale(.72)"/>`;
  return g;
}
function cardSvg(t){const w=DUR[t]*U;return `<svg viewBox="0 0 ${w} 74" style="width:${w*1.6}px;height:${74*1.6}px">${glyph(t,0,null)}</svg>`}

// 圖卡列
for(const t of ["e","q","d","h","r"]){
  const d=document.createElement("div");d.className="pcard";d.dataset.t=t;
  d.innerHTML=cardSvg(t)+`<span>${NAME[t][0]}</span><span style="color:#6b7280">${NAME[t][1]}</span>`;
  $("#palette").appendChild(d);
}
// 白板
for(let r=0;r<2;r++){
  const row=document.createElement("div");row.className="row";
  row.innerHTML=`<div class="ts${r?" empty":""}"><div>4</div><div>4</div></div>`;
  for(let k=0;k<4;k++){
    const m=r*4+k,d=document.createElement("div");d.className="m";d.dataset.m=m;
    d.innerHTML=`<svg class="ms" data-m="${m}" viewBox="0 0 200 86"></svg><div class="cnt"></div>`;
    row.appendChild(d);
  }
  $("#board").appendChild(row);
}
const sum=m=>M[m].reduce((a,t)=>a+DUR[t],0);
function render(){
  M.forEach((a,m)=>{
    let h="";
    for(let b=1;b<4;b++)h+=`<line x1="${b*50}" y1="6" x2="${b*50}" y2="68" stroke="#e2e8f0" stroke-dasharray="3 3"/>`;
    for(let b=0;b<4;b++)h+=`<text x="${b*50+8}" y="81" font-size="9" fill="#94a3b8">${b+1}</text><text x="${b*50+34}" y="81" font-size="9" fill="#cbd5e1">&amp;</text>`;
    let s=0,pairR=false;
    a.forEach((t,i)=>{
      let pair=null;
      if(pairR){pair="R";pairR=false}
      else if(t==="e"&&s%50===0&&a[i+1]==="e"){pair="L";pairR=true}
      h+=`<g class="blk" data-m="${m}" data-i="${i}">${glyph(t,s,pair)}</g>`;
      s+=DUR[t]*U;
    });
    h+=`<g class="ind"></g>`;
    document.querySelector(`.ms[data-m="${m}"]`).innerHTML=h;
    const n=sum(m),c=document.querySelector(`.m[data-m="${m}"] .cnt`);
    c.textContent=(n===CAP?"✓ ":"")+(n/2)+" / 4";c.classList.toggle("full",n===CAP);
  });
  document.querySelectorAll(".pcard").forEach(c=>c.classList.toggle("sel",c.dataset.t===sel));
}

let sel=null,drag=null,msgT=null;
function msg(t){const e=$("#msg");e.textContent=t;clearTimeout(msgT);msgT=setTimeout(()=>e.textContent="",2800)}
function insIdx(m,x){let s=0,idx=0;M[m].forEach((t,i)=>{const w=DUR[t]*U;if(s+w/2<x)idx=i+1;s+=w});return idx}
function startOf(m,idx){let s=0;for(let i=0;i<idx;i++)s+=DUR[M[m][i]]*U;return s}
function target(e){
  const el=document.elementFromPoint(e.clientX,e.clientY),mm=el&&el.closest(".m");
  if(!mm)return null;
  const r=mm.querySelector("svg").getBoundingClientRect();
  return{m:+mm.dataset.m,x:Math.max(0,Math.min(200,(e.clientX-r.left)/r.width*200))};
}
function clearInd(){document.querySelectorAll(".ind").forEach(g=>g.innerHTML="");document.querySelectorAll(".m.bad").forEach(m=>m.classList.remove("bad"))}
function fitMsg(m){const left=(CAP-sum(m))/2;msg(left>0?`這一小節只剩 ${left} 拍，放不下這張圖卡喔`:"這一小節已經滿 4 拍囉")}

document.addEventListener("pointerdown",e=>{
  const pc=e.target.closest(".pcard"),blk=e.target.closest(".blk"),mm=e.target.closest(".m");
  if(pc){drag={t:pc.dataset.t,from:null,pc:true}}
  else if(blk){const m=+blk.dataset.m,i=+blk.dataset.i;drag={t:M[m][i],from:{m,i}}}
  else if(mm&&sel){
    const tg=target(e);
    if(tg){if(sum(tg.m)+DUR[sel]<=CAP){M[tg.m].splice(insIdx(tg.m,tg.x),0,sel);render()}else fitMsg(tg.m)}
    return;
  }else return;
  drag.x=e.clientX;drag.y=e.clientY;drag.moved=false;
  e.preventDefault();
});
document.addEventListener("pointermove",e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){
    drag.moved=true;
    if(drag.from){M[drag.from.m].splice(drag.from.i,1);render()}
    const g=document.createElement("div");g.className="ghost";g.innerHTML=cardSvg(drag.t);document.body.appendChild(g);drag.ghost=g;
  }
  if(!drag.moved)return;
  drag.ghost.style.left=e.clientX+"px";drag.ghost.style.top=e.clientY+"px";
  clearInd();
  const tg=target(e);
  if(tg){
    const ok=sum(tg.m)+DUR[drag.t]<=CAP,px=startOf(tg.m,insIdx(tg.m,tg.x));
    document.querySelector(`.ms[data-m="${tg.m}"] .ind`).innerHTML=`<line x1="${px}" y1="3" x2="${px}" y2="70" stroke="${ok?"#16a34a":"#dc2626"}" stroke-width="3"/>`;
    if(!ok)document.querySelector(`.m[data-m="${tg.m}"]`).classList.add("bad");
  }
});
document.addEventListener("pointerup",e=>{
  if(!drag)return;
  const d=drag;drag=null;
  if(d.ghost)d.ghost.remove();
  clearInd();
  if(!d.moved){
    if(d.pc)sel=sel===d.t?null:d.t;else M[d.from.m].splice(d.from.i,1);
    render();return;
  }
  const tg=target(e);
  if(tg&&sum(tg.m)+DUR[d.t]<=CAP){M[tg.m].splice(insIdx(tg.m,tg.x),0,d.t)}
  else{
    if(tg)fitMsg(tg.m);
    if(tg&&d.from)M[d.from.m].splice(d.from.i,0,d.t); // 放不下就回到原位
  }
  render();
});
document.addEventListener("pointercancel",()=>{if(drag){if(drag.ghost)drag.ghost.remove();if(drag.moved&&drag.from)M[drag.from.m].splice(drag.from.i,0,drag.t);drag=null;clearInd();render()}});
$("#clear").onclick=()=>{if(playing)stopPlay();M.forEach(a=>a.length=0);render()};

/* ===== 聲音：節拍器與播放 ===== */
let ctx=null,playing=false,metOn=false,metTimer=null,metGain=null,metNext=0,metBeat=0,run=null,vis=[];
let bpm=80;
const dots=[...document.querySelectorAll("#dots i")];
function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}
function tick(t,accent,dest){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type="square";o.frequency.value=accent?1600:1100;
  g.gain.setValueAtTime(accent?.12:.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+.06);
}
function hit(t,dest){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type="triangle";o.frequency.setValueAtTime(720,t);o.frequency.exponentialRampToValueAtTime(320,t+.12);
  g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+.25);
}
function startMet(){
  audio();metGain=ctx.createGain();metGain.connect(ctx.destination);
  metNext=ctx.currentTime+.08;metBeat=0;
  metTimer=setInterval(()=>{
    while(metNext<ctx.currentTime+.15){
      tick(metNext,metBeat%4===0,metGain);vis.push({t:metNext,b:metBeat%4});
      metNext+=60/bpm;metBeat++;
    }
  },25);
}
function stopMet(){clearInterval(metTimer);metTimer=null;if(metGain){metGain.disconnect();metGain=null}}
function setDot(b){dots.forEach((d,i)=>d.classList.toggle("on",i===b))}
$("#met").onclick=()=>{
  metOn=!metOn;$("#met").classList.toggle("on",metOn);
  if(metOn){if(!playing)startMet()}else{stopMet();if(!playing){vis=[];setDot(-1)}}
};
$("#bpm").oninput=e=>{bpm=+e.target.value;$("#bpmv").textContent=bpm};

function play(){
  if(playing){stopPlay();return}
  if(!M.some(a=>a.length)){msg("先拖一些圖卡到白板上，再來播放喔！");return}
  audio();stopMet();vis=[];
  playing=true;$("#play").textContent="■ 停止";$("#play").classList.add("on");
  const g=ctx.createGain();g.connect(ctx.destination);
  const spb=60/bpm;let t0=ctx.currentTime+.12;
  if($("#countin").checked){
    for(let b=0;b<4;b++){tick(t0+b*spb,b===0,g);vis.push({t:t0+b*spb,b})}
    t0+=4*spb;
  }
  const events=[];
  M.forEach((a,m)=>{
    let s=0;
    a.forEach((t,i)=>{
      const tm=t0+(m*8+s)*spb/2;
      if(t!=="r")hit(tm,g);
      events.push({t:tm,end:tm+DUR[t]*spb/2,m,i});
      s+=DUR[t];
    });
    if(metOn)for(let b=0;b<4;b++){const tm=t0+(m*4+b)*spb;tick(tm,b===0,g);vis.push({t:tm,b})}
  });
  vis.sort((a,b)=>a.t-b.t);
  run={gain:g,events,end:t0+32*spb};
}
function stopPlay(){
  playing=false;$("#play").textContent="▶ 播放節奏";$("#play").classList.remove("on");
  if(run){run.gain.disconnect();run=null}
  vis=[];setDot(-1);
  document.querySelectorAll(".blk.playing").forEach(b=>b.classList.remove("playing"));
  if(metOn)startMet();
}
$("#play").onclick=play;
function loop(){
  requestAnimationFrame(loop);
  if(!ctx)return;
  const now=ctx.currentTime;
  while(vis.length&&vis[0].t<=now)setDot(vis.shift().b);
  if(playing&&run){
    document.querySelectorAll(".blk.playing").forEach(b=>b.classList.remove("playing"));
    const ev=run.events.find(v=>v.t<=now&&now<v.end);
    if(ev){const el=document.querySelector(`.blk[data-m="${ev.m}"][data-i="${ev.i}"]`);if(el)el.classList.add("playing")}
    if(now>run.end+.2)stopPlay();
  }
}
loop();
render();
</script>
</body>
</html>
